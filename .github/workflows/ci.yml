name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DEBUG: "true"
      FRONTEND_URL: http://localhost:3000
      SECRET_KEY: ci-test-secret-key-not-for-prod-32
      INTERNAL_API_SECRET: ci-internal-secret-16
      ADMIN_PASSWORD: CiAdminPass1!
      DATABASE_URL: sqlite+aiosqlite:///database/ci.db
      REDIS_URL: sqlite://database/ci-kv.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Backend unit + smoke
        run: |
          mkdir -p database
          cd backend && PYTHONPATH=. python -m unittest discover -s tests -q
      - name: Parser unit tests
        run: |
          PYTHONPATH=. python -m unittest discover -s parser -p 'test_*.py' -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
