name: carbit

x-python-slim: &python-slim
  image: carbit-python:latest
  build:
    context: .
    dockerfile: docker/python/Dockerfile
    args:
      INSTALL_PLAYWRIGHT: "0"

services:
  # Опційно: docker compose --profile cache up -d
  # Тоді в .env / environment постав REDIS_URL=redis://redis:6379/0
  redis:
    image: redis:7-alpine
    container_name: carbit-redis
    profiles: ["cache"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: carbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbit}
      POSTGRES_DB: ${POSTGRES_DB:-carbit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: carbit-backend:latest
    build:
      context: .
      dockerfile: docker/python/Dockerfile
      args:
        # Chromium лише тут (VIN-аукціон). Без --with-deps — менше місця на диску.
        INSTALL_PLAYWRIGHT: "1"
    container_name: carbit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      # PostgreSQL (основна БД). Legacy SQLite імпортується автоматично при першому старті.
      # Локально без Docker: DATABASE_URL=sqlite+aiosqlite:///database/autoradar.db
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://carbit:carbit@postgres:5432/carbit}
      SQLITE_MIGRATE_SOURCE: ${SQLITE_MIGRATE_SOURCE:-/app/database/autoradar.db}
      SQLITE_MIGRATE_ENABLED: ${SQLITE_MIGRATE_ENABLED:-1}
      SQLITE_MIGRATE_FORCE: ${SQLITE_MIGRATE_FORCE:-0}
      REDIS_URL: ${KV_URL:-sqlite://database/kv.db}
      TELEGRAM_MEDIA_DIR: /app/media
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LIQPAY_PUBLIC_KEY: ${LIQPAY_PUBLIC_KEY:-}
      LIQPAY_PRIVATE_KEY: ${LIQPAY_PRIVATE_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://carbit.info}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://carbit.info/api/v1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./database:/app/database
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 8s
      retries: 8
      start_period: 120s

  bot:
    <<: *python-slim
    container_name: carbit-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      BACKEND_URL: http://backend:8000/api/v1
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://carbit:carbit@postgres:5432/carbit}
      REDIS_URL: ${KV_URL:-sqlite://database/kv.db}
    entrypoint: ["python", "main.py"]
    working_dir: /app/bot
    volumes:
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  worker:
    <<: *python-slim
    container_name: carbit-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://carbit:carbit@postgres:5432/carbit}
      REDIS_URL: ${KV_URL:-sqlite://database/kv.db}
      TELEGRAM_MEDIA_DIR: /app/media
    entrypoint: ["python", "main.py"]
    working_dir: /app/worker
    volumes:
      - ./database:/app/database
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  telegram-worker:
    <<: *python-slim
    container_name: carbit-telegram-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://carbit:carbit@postgres:5432/carbit}
      REDIS_URL: ${KV_URL:-sqlite://database/kv.db}
      TELEGRAM_MEDIA_DIR: /app/media
    entrypoint: ["python", "main.py"]
    working_dir: /app/telegram_worker
    volumes:
      - ./database:/app/database
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://localhost:8000/api/v1}
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:-}
    container_name: carbit-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
