name: carbit

services:
  redis:
    image: redis:7-alpine
    container_name: carbit-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: carbit-postgres
    profiles: ["scale"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbit}
      POSTGRES_DB: ${POSTGRES_DB:-carbit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: carbit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///database/autoradar.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEGRAM_MEDIA_DIR: /app/media
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    command:
      - sh
      - -c
      - uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./database:/app/database
      - ./media:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: carbit-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      BACKEND_URL: http://backend:8000/api/v1
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    entrypoint: ["python", "main.py"]
    working_dir: /app/bot
    volumes:
      - ./database:/app/database
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: carbit-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///database/autoradar.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEGRAM_MEDIA_DIR: /app/media
    entrypoint: ["python", "main.py"]
    working_dir: /app/worker
    volumes:
      - ./database:/app/database
      - ./media:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import asyncio,sys; sys.path.insert(0,'/app/backend'); from app.services.health import heartbeat_age_seconds; age=asyncio.run(heartbeat_age_seconds('worker')); raise SystemExit(0 if age is not None and age < 600 else 1)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  telegram-worker:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: carbit-telegram-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///database/autoradar.db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TELEGRAM_MEDIA_DIR: /app/media
    entrypoint: ["python", "main.py"]
    working_dir: /app/telegram_worker
    volumes:
      - ./database:/app/database
      - ./media:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://localhost:8000/api/v1}
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:-}
    container_name: carbit-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
